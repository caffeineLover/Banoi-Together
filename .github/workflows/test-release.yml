name: Test build and release

on:
  push:
    branches: ['**']
    tags: ['v*-test*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile x64 observer
        shell: cmd
        run: poc\build.cmd
      - name: Test local acceptance correlation
        shell: cmd
        run: tests\Acceptance.Tests.cmd
      - name: Provision legacy XInput for the hosted smoke test
        shell: powershell
        run: |
          $xinput = Join-Path $env:SystemRoot 'System32/xinput1_3.dll'
          if (Test-Path -LiteralPath $xinput) { Write-Host 'System XInput 1.3 is already present.'; exit 0 }
          Write-Host 'System XInput 1.3 is absent on this runner; installing the Microsoft runtime for testing only.'
          $ProgressPreference = 'SilentlyContinue'
          $redist = Join-Path $env:RUNNER_TEMP 'directx_Jun2010_redist.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'directx-test-runtime'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          # Official download linked from https://www.microsoft.com/en-us/download/details.aspx?id=8109
          Invoke-WebRequest -UseBasicParsing -Uri 'https://download.microsoft.com/download/8/4/a/84a35bf1-dafe-4ae8-82af-ad2ae20b6b14/directx_Jun2010_redist.exe' -OutFile $redist
          $signature = Get-AuthenticodeSignature -LiteralPath $redist
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation,') {
            throw 'The runtime download does not have a valid Microsoft Corporation signature.'
          }
          $unpack = Start-Process -FilePath $redist -ArgumentList ('/Q /T:"' + $extract + '"') -WindowStyle Hidden -Wait -PassThru
          if ($unpack.ExitCode -ne 0) { throw "Runtime extraction failed: $($unpack.ExitCode)" }
          $install = Start-Process -FilePath (Join-Path $extract 'DXSETUP.exe') -ArgumentList '/silent' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $xinput)) { throw 'Runtime installation did not provide system XInput 1.3.' }
      - name: Verify proxy forwarding and unsupported-build refusal
        shell: cmd
        run: research\smoke_test.cmd
      - name: Test installer with Steam/game fixtures
        shell: powershell
        run: ./tests/Installer.Tests.ps1
      - name: Package and test extracted installer
        shell: powershell
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content ./package/version.json -Raw | ConvertFrom-Json).version
          if ($env:BUILD_REF_TYPE -eq 'tag') {
            if ($env:BUILD_REF_NAME -notmatch '^v(\d+\.\d+\.\d+-test(?:\.\d+)?)$') {
              throw 'Expected a test tag such as v0.1.0-test.1.'
            }
            $version = $Matches[1]
          }
          ./tests/Package.Tests.ps1 -Version $version
      - name: Upload installable test package
        uses: actions/upload-artifact@v7
        with:
          name: test-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  draft-release:
    # test.2 through test.5 use separately verified packages uploaded by hand.
    # CI still verifies their source and keeps its own build as an artifact.
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(fromJSON('["v0.1.0-test.2","v0.1.0-test.3","v0.1.0-test.4","v0.1.0-test.5"]'), github.ref_name)
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: test-package
          path: dist
      - name: Prepare draft prerelease only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEST_TAG: ${{ github.ref_name }}
        run: |
          $zip = "dist/DIDE-CoopQuestActivity-$env:TEST_TAG.zip"
          $checksum = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $checksum)) {
            throw 'The exact tagged ZIP and checksum are missing.'
          }
          $releases = gh release list --limit 100 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          $existing = @($releases | ConvertFrom-Json) | Where-Object { $_.tagName -eq $env:TEST_TAG }
          if ($existing) {
            if (-not $existing.isDraft) {
              throw 'Refusing to change an already published release.'
            }
            gh release upload $env:TEST_TAG $zip $checksum --clobber
          } else {
            gh release create $env:TEST_TAG $zip $checksum --draft --prerelease --verify-tag --title "Banoi Together $env:TEST_TAG" --notes 'Experimental diagnostic prerelease. Extract the installable ZIP and run Setup Banoi Together.cmd with the game closed. See [README](https://github.com/caffeineLover/Banoi-Together/blob/main/README.md) for installation and [PROGRESS](https://github.com/caffeineLover/Banoi-Together/blob/main/PROGRESS.md) for verified results, limitations and test instructions. Completion announcements are disabled.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release preparation failed.' }
